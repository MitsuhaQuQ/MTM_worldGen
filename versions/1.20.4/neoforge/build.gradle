architectury {
    neoForge()
}

loom {
    accessWidenerPath = project("${project.parent.path}:common").loom.accessWidenerPath

    runs {
        // Headless game test server: runs all game tests, then exits non-zero on failure
        gameTestServer {
            server()
            name "NeoForge Game Test"
            property "neoforge.enableGameTest", "true"
            property "neoforge.gameTestServer", "true"
            runDir "build/gametest"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    // Architectury puts its own copy of common on the runtime classpath; a second one splits its packages between two modules
    developmentNeoForge.extendsFrom common

    // Files in this configuration are bundled into the mod jar
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${mc("neoforge_version")}"

    common(project(path: "${project.parent.path}:common", configuration: "namedElements")) { transitive = false }
    shadowBundle project(path: "${project.parent.path}:common", configuration: "transformProductionNeoForge")
}

processResources {
    inputs.property "version", project.version

    filesMatching(["META-INF/mods.toml", "META-INF/neoforge.mods.toml"]) {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    // Loaders ignore it; run on its own, the jar opens the terrain preview
    manifest {
        attributes "Main-Class": "com.mtm.worldgen.preview.TerrainPreview", "Add-Exports": "java.desktop/com.apple.eawt.event"
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Runs take common from the jar Architectury hands them, not from the runtime classpath, so build it first
tasks.matching { it.name.startsWith("run") }.configureEach {
    dependsOn rootProject.project("${project.parent.path}:common").tasks.named("jar")
}
