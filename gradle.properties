org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# Use locally installed JDKs only (17, 21 and 25 are needed, see README)
org.gradle.java.installations.auto-download=false

# Project
mod_version=0.7.3
maven_group=com.mtm.worldgen
archives_base_name=mtm_worldgen

# Minecraft versions built, each with its modules in versions/<version>. 1.20.1 is the main version
minecraft_versions=1.20.1,26.3

# Each version: the Minecraft version it builds against, its Java, whether that Minecraft is obfuscated (and so mapped
# with Mojang's mappings and remapped), its loaders and their versions. Fabric needs the range of Minecraft versions in
# fabric.mod.json, which the version's own copy of that file names
1.20.1.minecraft_version=1.20.1
1.20.1.java_version=17
1.20.1.obfuscated=true
1.20.1.platforms=fabric,forge
1.20.1.fabric_loader_version=0.16.10
1.20.1.fabric_api_version=0.92.2+1.20.1
1.20.1.forge_version=47.3.0

26.3.minecraft_version=26.3
26.3.java_version=25
26.3.obfuscated=false
26.3.platforms=fabric,forge,neoforge
26.3.fabric_loader_version=0.20.1
26.3.fabric_api_version=0.165.2+26.3
26.3.forge_version=66.1.5
26.3.neoforge_version=26.3.0.101

# The latest snapshot, not built yet (it is not in minecraft_versions): only Fabric supports it so far, and it builds
# chunks in one pass per column (ChunkTerrainBuilder), which MTM's water, surface and carving hooks need redoing for.
# It builds on the 26.3 modules, with files of its own where the snapshot changed (see base_version in build.gradle)
26.4.minecraft_version=26.4-snapshot-7
26.4.java_version=25
26.4.obfuscated=false
26.4.platforms=fabric
26.4.base_version=26.3
26.4.fabric_loader_version=0.20.1
26.4.fabric_api_version=0.165.3+26.4

# Pure Java terrain logic in core: built for the oldest Java of the versions above
core_java_version=17
# Gson ships with every Minecraft; core compiles against the oldest one's
gson_version=2.10.1

# Amidst map viewer, which runs on its own Java
amidst_java_version=25

# Testing
junit_version=5.10.2
