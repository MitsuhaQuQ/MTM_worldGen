plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.7-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "dev.architectury.loom"

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    // Jars carry the Minecraft version after the mod's own, as in mtm_worldgen-fabric-0.2.0-1.20.1.jar; the version
    // inside the mod metadata stays the mod's alone
    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion = "${project.version}-${rootProject.minecraft_version}"
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = rootProject.java_version as int
    }
}
