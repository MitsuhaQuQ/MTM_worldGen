plugins {
    // One Loom for every version: its loom-remap plugin maps obfuscated Minecraft (up to 1.21.x), loom-no-remap
    // builds unobfuscated Minecraft (26.1 on) as it is
    id "architectury-plugin" version "3.5-SNAPSHOT" apply false
    id "dev.architectury.loom" version "1.17-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "9.6.1" apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

// The web map keeps its tiles in SQLite. Its driver carries native code for two dozen platforms, 14 MB in all; the
// loader jars nest a copy with only the platforms Minecraft runs on: Windows, Linux (glibc and musl) and macOS, on
// x86-64 and ARM64. The copy keeps the driver's own coordinates, in a repository of its own under build, so that a
// loader still picks one copy when other mods nest the driver too
repositories {
    mavenCentral()
}
configurations {
    sqlite {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    sqlite "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
}
ext.sqliteRepository = layout.buildDirectory.dir("sqlite").get().asFile
def sqliteNatives = ["Windows/x86_64", "Windows/aarch64", "Linux/x86_64", "Linux/aarch64", "Linux-Musl/x86_64",
                     "Linux-Musl/aarch64", "Mac/x86_64", "Mac/aarch64"]
def trimmedSqlite = new File(sqliteRepository, "org/xerial/sqlite-jdbc/${sqlite_jdbc_version}/sqlite-jdbc-${sqlite_jdbc_version}.jar")
def trimmedNatives = new File(trimmedSqlite.parentFile, "natives.txt")
// Made while configuring, since dependencies resolve from it; only again when the list of platforms changes
if (!trimmedSqlite.exists() || !trimmedNatives.exists() || trimmedNatives.text != sqliteNatives.join(",")) {
    trimmedSqlite.parentFile.mkdirs()
    def temporary = new File(trimmedSqlite.path + ".tmp")
    new java.util.zip.ZipFile(configurations.sqlite.singleFile).withCloseable { original ->
        new java.util.zip.ZipOutputStream(new FileOutputStream(temporary)).withCloseable { out ->
            original.entries().each { entry ->
                def path = entry.name
                if (path.startsWith("org/sqlite/native/") && !entry.directory && !sqliteNatives.any { path.startsWith("org/sqlite/native/${it}/") }) {
                    return
                }
                def copy = new java.util.zip.ZipEntry(path)
                copy.time = entry.time
                out.putNextEntry(copy)
                original.getInputStream(entry).withCloseable { out << it }
                out.closeEntry()
            }
        }
    }
    java.nio.file.Files.move(temporary.toPath(), trimmedSqlite.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    trimmedNatives.text = sqliteNatives.join(",")
}

// The properties of one Minecraft version, as in gradle.properties: mcProperty(project, "java_version") reads
// 1.20.1.java_version for the modules in versions/1.20.1
ext.mcProperty = { Project project, String key -> rootProject.property("${project.parent.name}.${key}") }

// The mod's modules, :<version>:<module>
configure(subprojects.findAll { it.parent != null && it.parent.parent == rootProject }) {
    def mcVersion = mcProperty(project, "minecraft_version")
    def javaVersion = mcProperty(project, "java_version") as int
    def obfuscated = mcProperty(project, "obfuscated").toBoolean()

    // Read by the modules' own build scripts
    ext.mc = { String key -> mcProperty(project, key) }
    ext.mcVersion = mcVersion
    ext.obfuscated = obfuscated

    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: obfuscated ? "dev.architectury.loom-remap" : "dev.architectury.loom-no-remap"
    // Loader modules bundle common into their jar
    if (project.name != "common") {
        apply plugin: "com.gradleup.shadow"

        // The web map's SQLite driver, trimmed: a nested jar, so that the loader picks one copy when other mods carry it too
        def sqlite = "org.xerial:sqlite-jdbc:${rootProject.sqlite_jdbc_version}"
        dependencies {
            include sqlite
            if (loom.platform.get().name() in ["FORGE", "NEOFORGE"]) {
                forgeRuntimeLibrary sqlite
            } else {
                runtimeOnly sqlite
            }
        }
        if (!obfuscated) {
            // Without remapping the shadow jar is the mod jar, but Loom nests jars into the plain jar only: the shadow
            // jar takes them from there, and Fabric's metadata names them as Loom's would
            def nested = "META-INF/jars/sqlite-jdbc-${rootProject.sqlite_jdbc_version}.jar"
            tasks.named("shadowJar") {
                dependsOn tasks.named("jar")
                from({ zipTree(tasks.named("jar").get().archiveFile) }) {
                    include "META-INF/jars/**", "META-INF/jarjar/**"
                }
                filesMatching("fabric.mod.json") {
                    filter { line -> line.contains('"schemaVersion"') ? line + System.lineSeparator() + "  \"jars\": [{\"file\": \"${nested}\"}]," : line }
                }
                doLast {
                    def jar = zipTree(archiveFile.get().asFile)
                    if (jar.matching { include nested }.isEmpty()) {
                        throw new GradleException("${archiveFile.get().asFile.name} does not nest ${nested}")
                    }
                }
            }
        }
    }

    architectury {
        minecraft = mcVersion
    }

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "Trimmed SQLite"
                    url = rootProject.sqliteRepository
                    metadataSources { artifact() }
                }
            }
            filter { includeModule "org.xerial", "sqlite-jdbc" }
        }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.minecraftforge.net/" }
    }

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    // Jars carry the Minecraft version after the mod's own, as in mtm_worldgen-fabric-0.2.0-1.20.1.jar; the version
    // inside the mod metadata stays the mod's alone
    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion = "${project.version}-${mcVersion}"
    }

    loom {
        silentMojangMappingsLicense()
        if (obfuscated) {
            // Mixins of obfuscated versions find their targets through the refmap the annotation processor writes, as
            // with Loom 1.7, which these jars were first released with. Newer Loom leaves the processor off by default
            mixin {
                useLegacyMixinAp = true
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mcVersion}"
        if (obfuscated) {
            mappings loom.officialMojangMappings()
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = javaVersion
        options.compilerArgs += ["-Xmaxerrs", "1000"]
    }

    // A version close to another one builds on that version's sources (<version>.base_version), which may build on
    // another version in turn: the module compiles the files of its bases, each file from the closest version that has
    // it, its own sources first. Only files that changed between versions need a copy of their own
    def bases = []
    def baseVersion = rootProject.findProperty("${project.parent.name}.base_version")
    while (baseVersion != null) {
        bases << rootProject.file("versions/${baseVersion}/${project.name}/src/main")
        baseVersion = rootProject.findProperty("${baseVersion}.base_version")
    }
    if (!bases.isEmpty()) {
        def ownSources = file("src/main")
        ["java", "resources"].each { kind ->
            def sync = tasks.register("syncBase${kind.capitalize()}", Sync) {
                bases.eachWithIndex { base, i ->
                    def closer = [ownSources] + bases.subList(0, i)
                    from(new File(base, kind)) {
                        exclude { element -> !element.directory && closer.any { new File(it, "${kind}/${element.relativePath.pathString}").exists() } }
                    }
                }
                into layout.buildDirectory.dir("baseSources/${kind}")
            }
            sourceSets.main[kind].srcDir(sync)
        }
    }
}
