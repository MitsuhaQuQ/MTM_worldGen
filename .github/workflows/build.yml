name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./gradlew :core:test :amidst:test

  game-tests:
    runs-on: ubuntu-latest
    strategy:
      # One loader failing says nothing about the others, and all must generate the same terrain
      fail-fast: false
      matrix:
        task:
          - ":1.20.1:fabric:runGametest"
          - ":1.20.1:forge:runGameTestServer"
          - ":1.20.4:fabric:runGametest"
          - ":1.20.4:neoforge:runGameTestServer"
          - ":1.21.1:fabric:runGametest"
          - ":1.21.1:neoforge:runGameTestServer"
          - ":1.21.4:fabric:runGametest"
          - ":1.21.4:neoforge:runGameTestServer"
          - ":26.3:fabric:runGametest"
          - ":26.3:forge:runGameTestServer"
          - ":26.3:neoforge:runGameTestServer"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./gradlew ${{ matrix.task }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./gradlew assemble
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            versions/*/*/build/libs/mtm_worldgen-*.jar
            !versions/*/common/build/libs/*
            !versions/*/*/build/libs/*-dev*.jar
            !versions/*/*/build/libs/*-sources.jar
            amidst/build/libs/*.jar
