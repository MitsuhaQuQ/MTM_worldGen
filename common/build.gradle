architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/mtm_worldgen.accesswidener")
}

dependencies {
    // Only for the Mixin and access widener annotations; no Fabric API classes may be used in common
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    // Tests run in parallel, each with its own logic and its own erosion regions in the making
    maxHeapSize = "3g"
    // Test methods share nothing: each builds its own terrain logic
    systemProperty "junit.jupiter.execution.parallel.enabled", "true"
    systemProperty "junit.jupiter.execution.parallel.mode.default", "concurrent"
}
