# Generated from WorldgenSettings.java by SettingsDocs; edit the comments there.
general=General settings: the world's height, the logic region grid, how far the logic looks, and what the world holds.
general.villageRadius=Villages only start where the ground within villageRadius blocks varies by at most villageMaxRelief.
general.seaLevel=Vanilla sea level field; the top water block sits at seaLevel - 1 (y=62).
general.maxSurfaceHeight=Highest surface height terrain may reach. The build height of new worlds follows from it.
general.regionSize=Logic region edge length in blocks.
general.cellSize=Coarse grid cell edge length in blocks; regionSize must be a multiple of it.
general.lookAhead=Radius in blocks read around a region when computing it.
general.regionCacheSize=Logic regions kept in memory.
general.logicRange=How far the terrain logic looks around each place, as a multiple of the ranges below, from 1 to 3. Higher values take in more of the land around when routing rivers, eroding mountains and shaping valleys, which gives longer and bigger rivers, wider and flatter river plains, and smoother joins between logic regions. The terrain keeps its proportions: features have the same size and the same share of plains, hills and mountains, only worked out over a wider area. It scales general.regionSize, general.lookAhead, rivers.flowLookAhead, rivers.queryReach, rivers.siltReach, erosion.margin and erosion.blend together, so their limits on each other still hold; each of those can also be raised on its own. The cost is speed and memory. Logic regions grow with the range, and each new one is computed before the chunks in it appear: at 2 a region is twice as wide and takes about 10 seconds instead of 1.5 (about twice the time for the same area), and the first one of a new world about 30 seconds instead of 5, as measured on a fast desktop. Fewer regions are kept in memory, but each is larger, so expect a few hundred MB more at 2 and more at 3. Terrain at 1 is unchanged.
general.softCapFraction=The top fraction of the height range is compressed so peaks approach but never exceed the maximum.
general.coastFadeHeight=Skeleton fades in while the continent base rises this many blocks above the sea.
general.structureTerrainMargin=Blocks kept above the surface when filling chunks, for terrain raised under structures.
general.caves=Whether the world has caves: vanilla's noise caves and its carved caves and ravines. Off, the ground is solid below the surface; the chambers under sinkholes belong to those and stay.
general.ores=Whether the world has ores: vanilla's ore features and its large ore veins. Off, rock holds none.
general.undergroundFallingBlocks=Whether ore features may place blocks that fall, such as gravel and sand, in the rock. Off, none are placed: caves, cliffs and overhangs would otherwise leave them hanging, and they come down when touched.
general.caveSurfaceMargin=Caves and ravines stay at least this many blocks below the surface.
general.caveFade=Noise caves fade in over this many blocks below that margin.
slopes=Maximum grades in percent (height difference / horizontal distance * 100).
slopes.plains=Plains, hills, plateaus and mountains, in turn.
continents=Continents and oceans: where land lies, how its coastline wanders and how deep the sea gets. Sizes are in blocks.
continents.oceanRatio=Target fraction of the surface covered by ocean.
continents.plateSpacing=Average distance between plate centers in blocks.
continents.plateJitter=How far plate centers move from their grid cell center, as a fraction of the spacing.
continents.oceanPlateFraction=Fraction of plates that are open ocean instead of continent.
continents.groupSpacing=Spacing of continent group sites in plate units: roughly how many plates wide a continent is.
continents.straitMean=Strait half-width offset between continent groups in plate units; negative closes it into land.
continents.landRange=Land rises this far above the sea in continent interiors, before the skeleton.
mountains=Mountain ranges, the highest of the three tiers: where they lie, their ridges and width, the steep igneous and the rounded eroded style of rock, and their cliff bands. Heights are on the 300 block scale, other sizes in blocks.
mountains.zoneWavelength=Wavelength of the tier field that divides land into plains, hills and mountains.
mountains.beltStrength=Plate tectonics: every plate drifts its own way. Where two plates move together, the tier field rises along their border into a mountain belt by up to beltStrength (the tier noise spans about -1 to 1); where they move apart, it sinks toward plains by up to riftStrength. Belts reach beltWidth blocks to either side of the border.
mountains.plateRelief=Each plate is lowland or upland country of its own, from -1 to 1, which moves the tier field by up to plateRelief over the whole plate, so plains, hills and mountains each hold wide connected stretches. The tier noise only adds zoneNoise of its own on top, for variety within them.
mountains.beltAlignment=How closely ranges in a belt follow the plate border, from 0 (the orientation field alone) to 1.
mountains.beltIgneous=How far a belt tips its ranges toward the steep igneous style, on the scale of the style field.
mountains.zoneCoverage=Share of the world in the mountain tier.
mountains.coastBand=Within this many blocks of the coast, mountains give way to hills.
mountains.siteMinZone=Sites need at least this much zone weight to carry a mountain.
mountains.massifHeight=Broad uplift of the whole orogeny zone.
mountains.peakMin=Ridge and peak height above the massif.
mountains.linkMinAlignment=Minimum cosine between a link and the orientation field for two range sites to join.
mountains.ridgeVariation=Ridge height varies along the range by this fraction.
mountains.textureShare=Spur and gully texture amplitude, as a fraction of the local mountain height.
mountains.textureStretch=The texture is this many times longer across a ridge than along it, so its creases run down the flanks.
mountains.textureBend=How far spurs wander sideways on their way down, in blocks.
mountains.textureReach=Spurs follow a ridge out to this distance, well past its foot, so open slopes run downhill too.
mountains.massifTextureWavelength=Wavelength of the texture on open massif land away from ridges.
mountains.gullyShare=Strength of the fine gullies relative to the texture; they break smooth slopes into uneven block steps.
mountains.massifTextureShare=Share of the massif uplift the texture also applies to, so land between ridges is not a flat table.
mountains.styleWavelength=Ranges blend between a steep igneous and a gentle wind-worn style, patch by patch at this wavelength.
mountains.igneousHeight=Height and width of a range relative to its nominal size, by style.
mountains.igneousSharpness=Mix between a rounded (0) and a sharp, concave (1) cross section, by style.
mountains.igneousTexture=Strength of the ridge texture, by style.
mountains.cliffStep=Cliff bands of igneous ranges: height of one step on the 300 block scale, patch size, and how sharp a step is.
mountains.cliffLow=Noise levels over which cliff patches fade in.
mountains.erodedGrade=Steepest slope of wind-worn ranges, as a share of the mountain slope limit.
mountains.summitWidth=Width in blocks of the gentle band along the crest, centered on the ridge line.
mountains.summitTextureReduction=How much the texture is reduced on the summit band, from 0 (not at all) to 1 (fully).
mountains.widthMin=Range width in blocks at half the mountain height, chosen per site. Taller mountains may exceed it to respect the slope limit.
mountains.profileSlopeShare=Share of the slope limit used by the main profile; the rest is headroom for texture and foothills.
mountains.mergeWidth=Blend width in blocks where two mountain profiles meet.
plateaus=Plateaus: table lands in zones of their own, raised to a common level whatever tier they lie on. Levels are heights above the sea on the 300 block scale; the zone noise decides where they lie and how wide their edges are.
plateaus.zoneWavelength=Size in blocks of the noise that places plateaus, and the share of the land they cover.
plateaus.plateChance=Like the tiers, plateaus follow the plates: plateChance of the continental plates are highland as a whole, which lifts their plateau field by plateHighland, and wide table lands flank the mountain belts where plates collide, reaching beltReach blocks from the border (beltShare). The plateau noise adds zoneNoise of its own.
plateaus.fade=Width of the plateau edge, as a share of the zone noise: narrow on the steep stretches that stand as table land escarpments, wide on the gentle slopes that make up most of an edge. Which stretch is which follows a noise of this wavelength, with this share of the edge steep.
plateaus.levelMin=The table stands this high above the sea, varying between the two over the plateau.
plateaus.tableRelief=Share of the hill relief kept on the table, which would otherwise be dead flat.
hills=The hill tier, between plains and mountains.
hills.height=Relief of the hills on the 300 block scale, and their wavelength in blocks.
beaches=Shores: how wide beaches are, the share of each kind of coast, and how sea cliffs rise. Sizes are in blocks.
beaches.minWidth=Beach depth inland varies along the coast between these; negative leaves coast without a beach.
beaches.widthContrast=Stretches fractal noise, which clusters around zero, so widths reach both ends of the range.
beaches.offshore=Sand continues this far offshore as shallow sea floor.
beaches.maxHeight=No beach on land rising more than this above the sea.
beaches.typeWavelength=Coast types change along the shore at this wavelength. The remainder after these shares is sea cliffs.
beaches.cliffHeight=Sea cliffs: height on the 300 block scale, how fast they rise inland, and how far they fall away behind.
islands=Islands in open water.
islands.spacing=One candidate per square of this size, in blocks.
islands.rockShare=Rocky islands; the rest are mushroom islands.
islands.shoreVariation=Shores wander by this share of the radius, at this wavelength.
islands.sandHeight=Island heights above the sea, on the 300 block scale.
islands.landMargin=Islands keep this far from land, mushroom islands further.
surface=Bare rock and snow on high or steep ground. Heights are for a 300 block surface and scale with it.
surface.snowLineTropical=Permanent snow line of each climate zone. Polar 0 means snow down to the sea.
surface.snowLineVariation=The snow line varies by this fraction.
surface.snowMaxSlope=Snow does not stay on faces steeper than this, in percent.
surface.rockSlope=Ground steeper than this is bare rock, in percent.
surface.rockSlopeVariation=The rock slope threshold varies by this many percentage points.
surface.rockMinAboveSea=Land within this many blocks of the sea stays soil, however steep.
surface.bareRockLine=From this fraction of the snow line up to the snow line, the rock slope falls to highRockSlope.
surface.highRockSlope=Rock slope at the snow line, in percent: thin high ground exposes rock on gentler faces.
surface.strataSlope=Rock strata show on faces steeper than this grade, in percent, or they spread into wide rings on gentle slopes.
surface.strataThickness=Height of a layer in blocks, and how far layers wander up and down.
surface.rockPatchThreshold=Noise level above which rock turns into the patch stone.
spawn=Where new players start: the search near the origin for dry ground at a moderate height.
spawn.searchRings=Rings searched outward from the world center, and the distance between them in coarse cells.
plains=The plains tier: wide lowlands for big cities.
plains.coverage=Share of the world in the plains tier.
plains.reliefShare=Share of hills and plateaus that remains on plains.
plains.greatWavelength=Great plains: a slow field that lowers the terrain zones where it lies, so plains there join into expanses many kilometers wide. The zone shares stay as they are, so they come out of small plains elsewhere. Coverage is the share of the world under the field, strength how far it lowers the zones, in zone noise units.
isolated=Isolated peaks where hills meet mountains, and dome hills inside the hill tier.
isolated.spacing=One candidate per square of this size, in blocks.
isolated.peakSpread=Base radius as a multiple of the height.
isolated.peakSpur=Spurs running down a peak: how far they push its outline, as a share of the radius.
isolated.peakWarp=Wander of a peak's outline, as a share of the radius, and its wavelength.
seaStacks=Sea stacks. Heights are on the 300 block scale, other sizes in blocks.
seaStacks.spacing=One candidate per square of this size, standing this far off rocky coasts.
seaStacks.heightMin=Height above the water, and radius.
seaStacks.warp=Wander of the outline, as a share of the radius, and its wavelength.
overhangs=Overhangs on steep faces. The height is on the 300 block scale, other sizes in blocks.
overhangs.reach=How far rock juts out or recedes at most.
overhangs.minHeight=Height above the sea they start at.
overhangs.slopeLow=Grades, in percent, between which they grow to full reach.
overhangs.patchWavelength=They come in patches of this size, where the patch noise lies between these.
overhangs.wavelength=Size of the ledges along the wall and up it. Noise cells are 8 blocks tall, so go no lower than about 24.
overhangs.sharpness=Above 1, more of the rock sits at full reach, with sharper edges.
sinkholes=Collapse sinkholes in hills and mountains, with a cave chamber below. Sizes are in blocks.
sinkholes.spacing=One candidate per square of this size.
sinkholes.minAboveSea=They need ground this far above the sea and this gentle (a fraction) around them.
sinkholes.warp=Wander of the outline, as a share of the radius, and its wavelength.
sinkholes.chamberRadius=Chamber below the pit: its radius as a multiple of the pit's, and half its height.
deserts=Dunes and oases in the desert biome (biomes.desert). Sizes and heights are in blocks. Everything fades out toward the edge of the desert, uplands, rivers, lakes and the coast, so nothing steps up at a biome border.
deserts.dunes=Transverse dune ridges across one wind direction per world: a gentle windward slope, a steeper lee face (leeShare of the wavelength) and rounded crests. The height is from trough to crest, and the slopes stay around half those of hills.
deserts.crestWarp=Crests wander off a straight line by this much, over this distance.
deserts.segmentWavelength=Ridges break into separate dunes along their length at this wavelength; below the threshold they stop.
deserts.fieldWavelength=Dune fields cover part of the desert, in patches of this size, between these noise values.
deserts.humidityFade=Fades toward the edge of the desert: in humidity, in the biome patch noise (as a share of one patch), from the coast inland, and in height below the highland band.
deserts.riverGap=Dunes keep this far back from river valley floors, and come back to full height over this distance beyond.
deserts.mountainFade=Share of the mountain tier from which dunes are gone: mountains keep their own shape.
deserts.hillRelief=Share of the hills' rolling relief kept in the desert, where hills give way to dunes: lower, and gentler by the same share, since the wavelength stays.
deserts.oases=Oases: one candidate per square of this size, kept where the desert is all around.
deserts.pondRadiusMin=Radius of the pond, its depth, and how far its shore wanders, as a share of the radius, at this wavelength.
deserts.greenRadius=Green land around the pond, and the dunes cleared around it, as multiples of its radius. Dunes fade out between the two, which needs room: cleared at 6 radii, they dropped at up to 44% around small ponds.
deserts.maxRelief=The ground around an oasis rises no more than this across the cleared radius.
deserts.caneChance=Share of the grass along the water that grows sugar cane, and its tallest stalks.
foreign=Chunks that MTM did not generate, such as region files merged in from another world. Sizes are in blocks.
foreign.grade=Width of the blend around them: the height step divided by this grade, within these limits.
foreign.upgradeMaxWidth=Chunks of an older MTM can blend further, since both sides are the same kind of terrain.
foreign.flatGround=Height superflat maps are raised to, moved in whole sections of 16 blocks.
foreign.pondReach=Water and rock of foreign rivers and lakes spread this far past the edge, closed in by banks.
foreign.damGrade=Grade of the dam between high water of this world and lower foreign land, and how far around the water it holds.
foreign.endLakeFactor=Size of the lake a river ends in when it would run into foreign chunks, as a multiple of its width.
foreign.riverLookAhead=Nodes followed down a river to see whether it runs into foreign chunks.
scale=Horizontal size of each kind of landform, as a multiple of its defaults: above 1 larger and further apart, below 1 smaller and closer together. Heights and everything measured in blocks, such as river widths, slopes and the texture on mountain sides, stay as they are, so the world keeps its 1 block = 1 meter scale.
scale.continents=Continents and oceans, with their straits and coastlines.
scale.terrainZones=The zones of plains, hills and mountains.
scale.mountains=Mountain ranges: how far apart their peaks stand, how wide they are, and how their course bends.
scale.plateaus=Plateau zones and the stretches of their edges.
scale.hills=Rolling hills.
scale.isolated=Isolated peaks and dome hills: how far apart they stand.
scale.climate=Climate zones and humidity.
scale.biomes=Patches of one biome.
erosion=Water erosion of mountains and hills, simulated per logic region on a grid of cells this many blocks wide, with a margin around the region and a band along its borders that blends it with its neighbors. Strength and the area exponent set the stream power law, rounds how long water works on the land, roughness how much noise the land starts with, and max depth caps the cut as a share of the height above the sea.
erosion.enabled=Whether erosion runs; off, mountains and hills keep the ridge texture of the skeleton instead. The simulation runs on a grid of cellSize blocks, over a window reaching margin blocks past each region, for the given number of rounds; neighboring regions mix their solutions in a band of blend blocks along their border.
erosion.uplift=Uplift per round as a share of the skeleton's height above the sea. The land rises while water cuts it, until the two balance: the drainage net that holds then branches like a real one. The result is scaled back to the skeleton's heights over this many blocks, which keeps ranges and peaks where they were designed.
erosion.maxRaise=How far erosion may raise land above the skeleton, as a share of its height above the sea.
erosion.baseSmoothing=Blocks over which the base each cell drains to (a river's water, or the sea) is smoothed before relief is scaled over it, so that land does not step where two rivers of different levels part.
erosion.warp=How far the grid is warped when it is read, which bends valleys off the grid's eight directions.
erosion.diffusion=Hillslope creep per round, smoothing out gullies too small to hold their own, and how evenly water spreads over the slopes below.
erosion.creeks=Creeks along the gullies erosion carved: a narrow channel with water down the middle of every gully that drains at least creekArea square blocks, up to creekMaxWidth wide where it drains creekWideArea. They stay off plains, as erosion does, and end where they reach a river or lake.
erosion.creekIncision=How far a full grown creek cuts its water below the lowest ground across it, and the grade of the walls of the small valley that leaves. Without them creeks lie on open slopes as ribbons of water.
erosion.creekStraightCells=Creeks that no other creek joins are left out when they run at least creekStraightCells cells and drain the same way along at least creekStraightShare of them: on an even slope erosion only carves rows of parallel gullies, and creeks in them ran as straight ditches side by side.
climate=Temperature zones and humidity.
climate.temperatureWavelength=Size in blocks of the temperature noise, which sets how large the climate zones are.
climate.tropicalShare=Area shares of the zones; polar takes the remainder.
climate.zoneJitterWavelength=Fine temperature noise that dithers zone borders.
climate.zoneTransition=Temperature margin on each side of a zone border where dry biomes give way, about 300 blocks wide.
climate.coastDistances=Coast distances in blocks mapped to continentalness, piecewise linear. The default values pass through vanilla's category boundaries and stay above -1.05, where mushroom fields would start.
climate.depthBlocksPerUnit=Blocks below the surface per unit of vanilla's depth parameter.
rivers=Drainage. Sizes are in coarse cells.
rivers.flowCellSize=Cell size of the routing grid; a multiple of general.cellSize that divides general.regionSize.
rivers.flowLookAhead=How far upstream of a cell catchments reach, in blocks.
rivers.majorTrunkTributaries=A trunk with more tributaries than this is a major trunk.
rivers.routeNoise=Height noise drainage routes over, so water gathers instead of running in parallel lines on even slopes.
rivers.lakeMinDepth=Water at least this deep over the ground of a filled depression is a lake.
rivers.lakeShoreStep=Spacing in blocks of the ground a lake's shore is found on; must divide flowCellSize.
rivers.bars=Sediment bars and beaches along rivers, from a short sediment budget down each river: barely any on steep rivers, which carry their load on, most where rivers leave steep ground and on slow lower reaches. Each node adds the load of the land newly draining into it, in full where the river above runs at siltSourceGrade or steeper; the river carries its catchment times its grade over siltCapacityGrade and drops the rest. Silt rises from 0 to 1 as the load reaching a node goes from siltRatioLow to siltRatioHigh times what it can carry. The budget reaches siltReach nodes upstream.
rivers.barBase=A bar reaches barBase plus barPerWidth per block of river width out from the water at full silt, and barShallow blocks into it, at barHeight above the water. It reaches barBend times further on the inside of bends and as much less on the outside. Bars come in stretches along the river, by noise of barWavelength, more of the river covered as barCoverage rises from -1 to 1. Bars are gravel where the river runs at gravelGrade or steeper above the bar and sand at sandGrade or gentler. They grow in with the river up to barFullWidth wide, so they line the lower reaches rather than every stream.
rivers.barRelief=Most a bar lowers the land onto its beach; land higher above it than twice this is left alone.
rivers.sinkSpacing=Inland sinks in deserts: one candidate per square of this many routing cells, far from the sea.
rivers.sinkDepth=Depth of the basin below the water, and how far its rim rises above it.
rivers.sinkWarp=Wander of the shore, as a share of a routing cell's weight, and its wavelength.
rivers.shortOutletLength=Lake outlets of at most this many nodes that drop at least this far into other water are left out.
rivers.nodeJitter=How far river nodes stray from their cell center, as a fraction of the cell.
rivers.meander=Sideways swing of river courses, as a fraction of the distance between nodes.
rivers.meanderWidth=Meanders fade on rivers wider than this.
rivers.queryReach=Rivers are found up to this many blocks away, which also bounds how far later steps can see them.
rivers.fitReach=With erosion, river water is lowered onto the ground it runs over, and never stands higher than it did up to this many nodes upstream: a river leaving a lake lower than its routing cells, or crossing a rise in the eroded ground, cuts through at the level it already reached instead of climbing back up.
rivers.lakeBackwater=With erosion, river water is held no lower than the lake it runs into up to this many nodes downstream. Eroded ground near a shore can lie below the lake, which is shaped on the smooth ground, and a river lowered onto it would meet the lake a step below its surface.
rivers.estuaryLength=Nodes before the sea over which rivers settle down to sea level, so that they do not fall into it.
rivers.estuaryWidening=Rivers widen by this factor toward the sea, up to the given width.
rivers.sandyMouthChance=Share of river mouths with sand along the banks of their last nodes, and how far it reaches from the water.
rivers.mouthSandContrast=Sand width varies along the banks; above 1 it gives out in places, and plants reach the water.
rivers.mouthClayWavelength=Clay flats among that sand, where this noise lies above the threshold.
rivers.duneHeight=Low dunes on that sand, which keep it from lying in long straight steps.
rivers.deltaChance=Share of big rivers on a low, soft shore that end in a delta.
rivers.deltaLength=Nodes above the sea where a delta opens.
rivers.deltaBranchesMin=Channels of a delta, the main stem included.
rivers.deltaSpread=How far branches end from the main mouth, how far they run out to sea, and how far they wander.
rivers.deltaWidthVariation=Branch width varies by this share, over this many stretches of a branch.
rivers.deltaBranchWidth=Size of a branch as a share of the river at the head of the delta.
rivers.deltaMaxRelief=Land around a delta may rise this far above the sea.
rivers.mouthFlare=A side branch widens by this factor over its last edge, rounding the corners where it meets the main river.
rivers.widthWavelength=Distance over which a river's width wanders along its length.
rivers.gentleRiverSlope=Rivers on a slope of at most gentleRiverSlope are plainWidthFactor times their base width, those at steepRiverSlope or more steepWidthFactor times, with a smooth change between.
rivers.minChannelWidth=Narrower rivers still cut a channel this wide, or noise cells would lose them.
rivers.waterfalls=Edges falling at least fallGrade over their length, and at least fallMinDrop blocks, drop in waterfalls of at most fallHeight blocks between level pools.
rivers.fans=Alluvial fans: where a stream or tributary leaves a stretch steeper than fanSteepGrade for one gentler than fanGentleGrade, with this chance, it spreads a low cone of what it carried downstream from the break in slope. Radius and height at the apex vary by fanVariation either way; tributaries build them fanTributaryScale times larger. The cone opens fanSpread degrees to each side of the river.
rivers.fanTrench=Blocks from the channel's edge over which a fan rises to its full height, the trench its stream runs in.
rivers.sourceTaper=Share of its first edge over which a river grows from nothing to its channel: width, depth, valley and the texture it smooths out all start at zero at the source.
rivers.valleyFloorFactor=Valley floor width as a multiple of the river width.
rivers.valleyWallGrade=Valley walls: land may rise this grade above the floor at first, then steeper by the curve per block.
rivers.valleyWallRelief=Valley walls wander up and down by this many blocks at this wavelength, so they do not read as one smooth bowl.
rivers.valleyWallSoftness=Land keeps up to this many blocks of its height above a valley wall, rounding the edge where they meet.
rivers.valleyBankBlend=Beyond the valley floor, land leaves the river's own bank height over this many blocks.
rivers.floodplainBase=Floodplains flatten low land beside rivers: this many blocks wide, plus this many per block of river width.
rivers.floodplainRise=Plains stay within this many blocks above the river.
rivers.floodplainRelief=Land this far above the river is no plain and stays as it is, however close.
rivers.oxbows=Oxbow lakes: beside tributaries and trunk rivers falling no more than oxbowMaxGrade, with this chance per routing edge, a crescent lake on the floodplain oxbowDepth deep. Its radius is oxbowRadiusMin to oxbowRadiusMax river widths, its width oxbowWidth river widths (at least oxbowMinWidth), its arc reaches oxbowSpan degrees to each side, and it keeps oxbowGap blocks from the channel. The plain around it may rise at most oxbowMaxRelief above the river.
rivers.coastBlend=River banks fade out over this many blocks of land height above the sea.
rivers.textureFadeBase=Ridge texture fades in over this many blocks from a valley floor, plus this many per block of river width.
rivers.erodedTextureFadeBase=The same with erosion, which only fades out at the banks: its gullies run down to the rivers already, and fading them over the reach above would leave smooth lobes where they should end.
rivers.nodeSmoothing=How far a river node moves toward the middle of its neighbors, rounding sharp bends.
rivers.trunkSmoothing=River nodes averaged on each side when smoothing big rivers.
rivers.bankHeight=Height of the valley floor above the water.
biomes=Biomes: which vanilla biomes go where, by climate zone and humidity, by height band below the snow line, and along water. Ids are vanilla biome names.
biomes.patchWavelength=Size of the patches when a list holds several biomes.
biomes.dryHumidity=Lowland below this humidity counts as dry, at or above wetHumidity as wet.
biomes.beachDepth=Land this far inland from the coast and low enough is beach biome.
biomes.deepOceanDepth=Sea this much deeper than the surface uses the deep ocean biome.
biomes.treeLine=Above this fraction of the snow line is the alpine band, where trees stop.
biomes.highlandLine=Highland starts this fraction of the way from the sea to the snow line.
biomes.bandWander=Altitude bands wander up and down by this many blocks, over this distance.
biomes.caveDepth=Blocks below the surface where cave biomes can start.
biomes.caves=Cave biomes from dry to humid.
biomes.deepDark=The deep dark: patches deep underground over about a fifth of the world, which brings sculk and ancient cities. Patches are deepDarkWavelength blocks across; their top lies below deepDarkTop, higher toward their middle by up to deepDarkTopWander blocks per unit of noise above the threshold.
biomes.mushroomIsland=Biome of mushroom islands.
biomes.desert=The desert, which gets dunes and oases (deserts group), and the biome of the green land around an oasis.
biomes.unrealisticOnMountains=Whether the biomes below may grow on mountains. Badlands lay terracotta bands at fixed heights, which on a mountain hundreds of blocks tall run around it as rings of color. When off, mountain ranges and their slopes take the other biomes of the same list, or the medium biomes when none is left. Mountains are where the mountain tier share exceeds mountainShare; plateaus and hills keep these biomes either way.
biomes.tropical=Biomes of the tropical zone, by landform and humidity.
biomes.temperate=Biomes of the temperate zone.
biomes.cold=Biomes of the cold zone.
biomes.polar=Biomes of the polar zone.
BiomeZone.ocean=Sea, deep sea and sandy coasts.
BiomeZone.rockyShore=Rocky coasts and rocky islands.
BiomeZone.river=River channels.
BiomeZone.dry=Lowland, from dry through medium to wet humidity.
BiomeZone.swamp=Optional: wet lowland just above the sea.
BiomeZone.highland=Highland: the band between the lowland and the tree line.
BiomeZone.dryHighland=Optional: dry highland away from zone borders.
BiomeZone.alpine=Above the tree line, and above the snow line.
