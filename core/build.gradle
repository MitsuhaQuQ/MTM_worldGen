// The terrain logic: plain Java that knows nothing of Minecraft. No module depends on it: each version's common module
// compiles these sources along with its own, so they ship inside every mod jar
apply plugin: "java"

repositories {
    mavenCentral()
}

def coreJava = rootProject.core_java_version as int

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(coreJava)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = coreJava
}

dependencies {
    // Minecraft brings Gson into the game; the terrain preview runs without it
    compileOnly "com.google.code.gson:gson:${rootProject.gson_version}"

    testImplementation "com.google.code.gson:gson:${rootProject.gson_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    // Tests run in parallel, and most share one logic whose caches hold every region they visit
    maxHeapSize = "6g"
    // Test methods share nothing: each builds its own terrain logic
    systemProperty "junit.jupiter.execution.parallel.enabled", "true"
    systemProperty "junit.jupiter.execution.parallel.mode.default", "concurrent"
}

// The config file shows the documentation of WorldgenSettings as comments, from a resource generated off its source.
// SettingsDocsTest fails when the resource is out of date
tasks.register("updateSettingsDocs", JavaExec) {
    group = "mtm"
    description = "Writes the config file comments from the documentation in WorldgenSettings.java"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.mtm.worldgen.logic.SettingsDocs"
    args file("src/main/java/com/mtm/worldgen/logic/WorldgenSettings.java").absolutePath,
            file("src/main/resources/mtm_worldgen/settings_docs.properties").absolutePath
    doFirst {
        file("src/main/resources/mtm_worldgen").mkdirs()
    }
}
